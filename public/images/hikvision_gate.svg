<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="concretePillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="brushedSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Exterior Environment -->
  <rect width="800" height="600" fill="#0b0f14"/>

  <!-- Architectural Concrete Fence Pillar -->
  <rect x="220" y="20" width="360" height="560" rx="8" fill="url(#concretePillar)" stroke="#64748b" stroke-width="2"/>
  <!-- Concrete Tie-Rod Holes / Architectural Concrete Texture -->
  <circle cx="260" cy="80" r="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <circle cx="540" cy="80" r="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <circle cx="260" cy="520" r="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <circle cx="540" cy="520" r="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>

  <!-- Stainless Steel Intercom Villa Outdoor Station (Hikvision KD8003/KD9203 Style) -->
  <rect x="300" y="110" width="200" height="380" rx="14" fill="url(#brushedSteel)" stroke="#94a3b8" stroke-width="3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>

  <!-- Camera Module Upper Window -->
  <rect x="320" y="130" width="160" height="90" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5"/>
  <!-- 180 Fisheye WDR Lens -->
  <circle cx="400" cy="175" r="26" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  <circle cx="400" cy="175" r="18" fill="#0284c7"/>
  <circle cx="400" cy="175" r="10" fill="#020617"/>
  <circle cx="396" cy="171" r="3" fill="#ffffff"/>
  <!-- IR & Microphone Slot -->
  <circle cx="350" cy="175" r="4" fill="#64748b"/>
  <circle cx="450" cy="175" r="4" fill="#64748b"/>

  <!-- LED Night Illuminator / Brand Label -->
  <text x="375" y="240" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">HIKVISION</text>

  <!-- Biometric Facial Recognition Display / Screen -->
  <rect x="320" y="255" width="160" height="95" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Live Face Recognition HUD Simulation -->
  <circle cx="400" cy="300" r="25" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="355" y="338" fill="#22c55e" font-family="monospace" font-size="8" font-weight="bold">ZWERYFIKOWANO: DOMOWNIK</text>

  <!-- Call Button with Glowing Ring -->
  <circle cx="400" cy="415" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Bell Icon Inside Button -->
  <path d="M 400 395 C 390 395, 388 410, 385 422 L 415 422 C 412 410, 410 395, 400 395 Z" fill="#ffffff"/>
  <circle cx="400" cy="426" r="3" fill="#ffffff"/>

  <!-- Gate Frame visible on the left -->
  <line x1="160" y1="0" x2="160" y2="600" stroke="#0f172a" stroke-width="8"/>
  <line x1="80" y1="180" x2="160" y2="180" stroke="#334155" stroke-width="4"/>
  <line x1="80" y1="360" x2="160" y2="360" stroke="#334155" stroke-width="4"/>

  <!-- Annotations / Viewfinder Overlay -->
  <rect x="30" y="25" width="740" height="550" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="16 8"/>
  <g fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">
    <text x="45" y="48">● STACJA BRAMOWA VILLA IP [STAL NIERDZEWNA]</text>
    <text x="45" y="558">SONY A7R V • 85mm f/1.4 GM • 1/250s ISO 64</text>
    <text x="480" y="48">SŁUPEK Z BETONU ARCHITEKTONICZNEGO</text>
    <text x="560" y="558">OTWARCIE: BIOMETRIA 0.2s</text>
  </g>
</svg>

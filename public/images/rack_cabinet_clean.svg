<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rackMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="blueCable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dinShelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <!-- Clean Concrete Utility Room Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Architectural Concrete Wall Joint Lines -->
  <line x1="0" y1="180" x2="800" y2="180" stroke="#27272a" stroke-width="1.5"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#27272a" stroke-width="1.5"/>

  <!-- 19-inch Server Rack Cabinet Frame -->
  <rect x="150" y="40" width="500" height="520" rx="3" fill="url(#rackMetal)" stroke="#3f3f46" stroke-width="2"/>
  <rect x="175" y="60" width="450" height="480" rx="2" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>

  <!-- Rack 19" Mounting Rails with U-Height Marks -->
  <rect x="180" y="65" width="26" height="470" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <rect x="594" y="65" width="26" height="470" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  
  <!-- U-1: Patch Panel 24x CAT6A STP with Fluke Certification Tag -->
  <rect x="210" y="80" width="380" height="48" rx="2" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="225" y="100" fill="#e4e4e7" font-family="monospace" font-size="10" font-weight="bold">DOMENCE CAT.6A STP PATCH PANEL</text>
  <rect x="490" y="88" width="90" height="16" rx="2" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="535" y="100" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" font-weight="bold">FLUKE CERTIFIED</text>
  <!-- 24 Combed Patch Cords -->
  <g fill="#0284c7">
    <rect x="225" y="110" width="10" height="12" rx="1"/>
    <rect x="240" y="110" width="10" height="12" rx="1"/>
    <rect x="255" y="110" width="10" height="12" rx="1"/>
    <rect x="270" y="110" width="10" height="12" rx="1"/>
    <rect x="285" y="110" width="10" height="12" rx="1"/>
    <rect x="300" y="110" width="10" height="12" rx="1"/>
    <rect x="315" y="110" width="10" height="12" rx="1"/>
    <rect x="330" y="110" width="10" height="12" rx="1"/>
    <rect x="345" y="110" width="10" height="12" rx="1"/>
    <rect x="360" y="110" width="10" height="12" rx="1"/>
    <rect x="375" y="110" width="10" height="12" rx="1"/>
    <rect x="390" y="110" width="10" height="12" rx="1"/>
    <rect x="405" y="110" width="10" height="12" rx="1"/>
    <rect x="420" y="110" width="10" height="12" rx="1"/>
    <rect x="435" y="110" width="10" height="12" rx="1"/>
    <rect x="450" y="110" width="10" height="12" rx="1"/>
    <rect x="465" y="110" width="10" height="12" rx="1"/>
    <rect x="480" y="110" width="10" height="12" rx="1"/>
  </g>

  <!-- U-2: Gigabit Managed PoE+ Switch 24-Port -->
  <rect x="210" y="140" width="380" height="50" rx="2" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="225" y="160" fill="#e4e4e7" font-family="monospace" font-size="10" font-weight="bold">24-PORT POE+ GIGABIT MANAGED SWITCH</text>
  <circle cx="560" cy="158" r="3.5" fill="#10b981"/>
  <circle cx="572" cy="158" r="3.5" fill="#10b981"/>
  <!-- Status LEDs Row -->
  <g fill="#10b981">
    <circle cx="228" cy="178" r="2"/>
    <circle cx="243" cy="178" r="2"/>
    <circle cx="258" cy="178" r="2"/>
    <circle cx="273" cy="178" r="2"/>
    <circle cx="288" cy="178" r="2"/>
    <circle cx="303" cy="178" r="2"/>
    <circle cx="318" cy="178" r="2"/>
    <circle cx="333" cy="178" r="2"/>
    <circle cx="348" cy="178" r="2"/>
    <circle cx="363" cy="178" r="2"/>
    <circle cx="378" cy="178" r="2"/>
    <circle cx="393" cy="178" r="2"/>
  </g>

  <!-- U-3: DIN Rail Shelf with Shelly Pro Automation Modules -->
  <rect x="210" y="204" width="380" height="96" rx="2" fill="#121214" stroke="#3f3f46" stroke-width="1.5"/>
  <!-- Metal DIN Rail Steel Bar -->
  <rect x="215" y="246" width="370" height="12" fill="#71717a" stroke="#a1a1aa" stroke-width="0.8"/>
  
  <!-- Shelly Pro 4PM (4-channel DIN relay) -->
  <rect x="235" y="220" width="70" height="68" rx="2" fill="url(#dinShelly)" stroke="#52525b" stroke-width="1"/>
  <text x="240" y="234" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold">SHELLY PRO 4PM</text>
  <rect x="240" y="238" width="8" height="8" rx="1" fill="#0284c7"/>
  <circle cx="256" cy="242" r="2" fill="#10b981"/>
  <circle cx="266" cy="242" r="2" fill="#10b981"/>
  <circle cx="276" cy="242" r="2" fill="#10b981"/>
  <circle cx="286" cy="242" r="2" fill="#10b981"/>
  <text x="240" y="278" fill="#a1a1aa" font-family="monospace" font-size="7">LAN RJ45</text>

  <!-- Shelly Pro 2PM (2-channel Shutter / Blinds DIN) -->
  <rect x="315" y="220" width="45" height="68" rx="2" fill="url(#dinShelly)" stroke="#52525b" stroke-width="1"/>
  <text x="320" y="234" fill="#ffffff" font-family="monospace" font-size="7" font-weight="bold">PRO 2PM</text>
  <rect x="320" y="238" width="8" height="8" rx="1" fill="#0284c7"/>
  <circle cx="336" cy="242" r="2" fill="#10b981"/>
  <circle cx="346" cy="242" r="2" fill="#10b981"/>

  <!-- Shelly Pro Dimmer 2PM (DIN Dimmer) -->
  <rect x="370" y="220" width="45" height="68" rx="2" fill="url(#dinShelly)" stroke="#52525b" stroke-width="1"/>
  <text x="374" y="234" fill="#ffffff" font-family="monospace" font-size="7" font-weight="bold">DIMMER</text>
  <rect x="375" y="238" width="8" height="8" rx="1" fill="#0284c7"/>
  <circle cx="392" cy="242" r="2" fill="#f59e0b"/>

  <!-- Shelly Pro 3EM-63T (3-Phase Energy Meter) -->
  <rect x="425" y="220" width="60" height="68" rx="2" fill="url(#dinShelly)" stroke="#52525b" stroke-width="1"/>
  <text x="430" y="234" fill="#ffffff" font-family="monospace" font-size="7" font-weight="bold">PRO 3EM</text>
  <rect x="430" y="240" width="50" height="20" rx="1" fill="#09090b" stroke="#3f3f46" stroke-width="0.8"/>
  <text x="435" y="254" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">0.42 kW</text>

  <!-- U-4: Hikvision DeepinMind NVR 4K Surveillance Storage -->
  <rect x="210" y="312" width="380" height="65" rx="2" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="225" y="334" fill="#e4e4e7" font-family="monospace" font-size="10" font-weight="bold">HIKVISION 4K NVR SURVEILLANCE RECORDER</text>
  <text x="225" y="348" fill="#71717a" font-family="monospace" font-size="8">LOKALNY ZAPIS NVR • DYSKI WD PURPLE 2x 8TB • ZERO PUBLIC CLOUD</text>
  <!-- HDD Activity Indicators -->
  <circle cx="550" cy="332" r="3" fill="#38bdf8"/>
  <circle cx="564" cy="332" r="3" fill="#10b981"/>

  <!-- U-5: Pure Sinewave Online UPS Power Backup Unit -->
  <rect x="210" y="390" width="380" height="80" rx="2" fill="#121214" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="225" y="412" fill="#e4e4e7" font-family="monospace" font-size="10" font-weight="bold">ONLINE PURE SINEWAVE UPS BACKUP 1500VA</text>
  <rect x="225" y="422" width="160" height="24" rx="2" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <text x="235" y="438" fill="#10b981" font-family="monospace" font-size="10">AC 230V • BATT 100%</text>
  <circle cx="560" cy="410" r="4" fill="#10b981"/>

  <!-- Laser Cut Cable Management Ties (Left & Right Sides) -->
  <path d="M 195,115 Q 165,180 165,240 Q 165,300 195,335" stroke="#0284c7" stroke-width="8" fill="none" opacity="0.85"/>
  <path d="M 605,115 Q 635,180 635,240 Q 635,300 605,335" stroke="#334155" stroke-width="8" fill="none" opacity="0.85"/>

  <!-- Architectural HUD Overlay Card -->
  <g transform="translate(30, 520)">
    <rect width="360" height="52" rx="2" fill="#09090b" opacity="0.9" stroke="#27272a" stroke-width="1"/>
    <circle cx="20" cy="26" r="4" fill="#10b981"/>
    <text x="34" y="22" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">SZAFA TELETECHNICZNA RACK 19"</text>
    <text x="34" y="38" fill="#a1a1aa" font-family="monospace" font-size="9">CERTYFIKACJA FLUKE • SZYNOPRZEWÓD DIN SHELLY PRO • UPS</text>
  </g>
</svg>

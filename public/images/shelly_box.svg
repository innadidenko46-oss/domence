<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="50%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="switchPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shellyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Wall with Plaster Texture -->
  <rect width="800" height="600" fill="url(#wallBg)"/>

  <!-- Plaster Wall Cutout / Flush Box 60mm -->
  <circle cx="400" cy="300" r="190" fill="#090c10" stroke="#334155" stroke-width="4"/>
  <circle cx="400" cy="300" r="175" fill="#05070a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Screws in Box -->
  <circle cx="235" cy="300" r="6" fill="#64748b"/>
  <circle cx="565" cy="300" r="6" fill="#64748b"/>

  <!-- Copper Wires Entering Box -->
  <!-- Phase Wire Brown -->
  <path d="M 330 140 Q 340 210, 365 240" stroke="#92400e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Neutral Wire Blue -->
  <path d="M 400 135 Q 395 200, 390 235" stroke="#0284c7" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Earth Wire Yellow-Green -->
  <path d="M 460 140 Q 450 190, 435 220" stroke="#84cc16" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Switch Output Black -->
  <path d="M 440 370 Q 420 420, 390 450" stroke="#0f172a" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- WAGO 221 Lever Connectors -->
  <rect x="345" y="210" width="34" height="22" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="348" y="212" width="9" height="10" rx="1" fill="#ea580c"/>
  <rect x="358" y="212" width="9" height="10" rx="1" fill="#ea580c"/>
  <rect x="368" y="212" width="9" height="10" rx="1" fill="#ea580c"/>

  <!-- Shelly Plus 1PM Module in Box -->
  <rect x="330" y="255" width="140" height="110" rx="14" fill="url(#shellyBlue)" stroke="#38bdf8" stroke-width="2"/>
  <text x="350" y="285" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="extrabold">Shelly Plus</text>
  <text x="350" y="302" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="bold">1PM Wi-Fi &amp; BLE</text>
  <text x="350" y="325" fill="#e0f2fe" font-family="monospace" font-size="9">POWER METER: 230V 16A</text>
  <text x="350" y="340" fill="#e0f2fe" font-family="monospace" font-size="9">FLAME RETARDANT V-0</text>
  <circle cx="450" cy="275" r="4" fill="#22c55e"/>

  <!-- Brushed Steel Switch Frame Pulled Aside to Show Interior -->
  <rect x="470" y="160" width="220" height="240" rx="16" fill="url(#switchPlate)" stroke="#475569" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.7))"/>
  <!-- Switch Rocker -->
  <rect x="500" y="190" width="160" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="580" y1="190" x2="580" y2="370" stroke="#0f172a" stroke-width="3"/>
  <circle cx="580" cy="280" r="3" fill="#f59e0b"/>

  <!-- Annotations / Overlay -->
  <rect x="30" y="25" width="740" height="550" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="16 8"/>
  <g fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">
    <text x="45" y="48">● SCHEMAT MONTAŻU [BEZ KUCIA ŚCIAN]</text>
    <text x="450" y="48">PUSZKA PODTYNKOWA 60mm + SHELLY 1PM</text>
    <text x="560" y="558">CERTYFIKAT V-0 / CE</text>
  </g>
</svg>

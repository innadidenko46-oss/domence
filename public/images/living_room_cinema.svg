<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="wallDusk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="60%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="warmLightCove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1c1c20" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skyDusk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="10%" stop-color="#27272a"/>
      <stop offset="90%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="floorWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="50%" stop-color="#1c1510"/>
      <stop offset="100%" stop-color="#120c08"/>
    </linearGradient>
    <linearGradient id="sofaFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38383e"/>
      <stop offset="100%" stop-color="#222226"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Architectural Living Room Wall & Ceiling -->
  <rect width="1200" height="675" fill="url(#wallDusk)"/>

  <!-- Left Floor-to-Ceiling Panoramic Glass Window -->
  <rect x="0" y="40" width="380" height="520" fill="url(#skyDusk)"/>
  <!-- Garden Trees Silhouettes outside Window -->
  <path d="M40 560 L70 340 L100 560 Z" fill="#070b14" opacity="0.8"/>
  <path d="M85 560 L120 280 L160 560 Z" fill="#050810" opacity="0.9"/>
  <path d="M140 560 L180 320 L220 560 Z" fill="#070b14" opacity="0.75"/>
  <path d="M220 560 L270 260 L320 560 Z" fill="#030508"/>
  <path d="M300 560 L340 350 L380 560 Z" fill="#080c16" opacity="0.85"/>
  <!-- Minimalist Window Frames -->
  <line x1="190" y1="40" x2="190" y2="560" stroke="#26262b" stroke-width="6"/>
  <line x1="380" y1="40" x2="380" y2="560" stroke="#26262b" stroke-width="10"/>

  <!-- Ceiling Linear Recessed Warm 2400K LED Cove -->
  <rect x="380" y="30" width="820" height="8" fill="#fef3c7" filter="url(#softGlow)"/>
  <rect x="380" y="38" width="820" height="90" fill="url(#warmLightCove)"/>

  <!-- Invisible Flush Ceiling Speakers (2 discreet magnetic grilles flush with plaster) -->
  <circle cx="560" cy="55" r="16" fill="#222226" stroke="#2e2e34" stroke-width="1.5"/>
  <circle cx="560" cy="55" r="12" fill="#18181b" stroke="#3f3f46" stroke-dasharray="2,2"/>
  <circle cx="940" cy="55" r="16" fill="#222226" stroke="#2e2e34" stroke-width="1.5"/>
  <circle cx="940" cy="55" r="12" fill="#18181b" stroke="#3f3f46" stroke-dasharray="2,2"/>
  <text x="560" y="85" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="9" letter-spacing="1">FLUSH CEILING AUDIO</text>
  <text x="940" y="85" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="9" letter-spacing="1">DOLBY ATMOS IN-CEILING</text>

  <!-- Flush Motorized Cinema Screen Descending from Ceiling Slot -->
  <!-- Ceiling Slot -->
  <rect x="460" y="36" width="600" height="6" rx="2" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <!-- Screen Canvas -->
  <rect x="475" y="42" width="570" height="320" rx="3" fill="url(#screenGrad)" stroke="#3f3f46" stroke-width="2"/>
  <!-- Cinematic Ambient Glow on screen -->
  <rect x="490" y="55" width="540" height="295" rx="2" fill="#0d1117" opacity="0.95"/>
  <circle cx="760" cy="200" r="120" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="720" cy="210" r="80" fill="#f59e0b" opacity="0.06" filter="url(#softGlow)"/>
  <!-- Status Badge on Screen Header -->
  <rect x="700" y="68" width="120" height="18" rx="2" fill="#000000" opacity="0.6"/>
  <text x="760" y="81" text-anchor="middle" fill="#e4e4e7" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1">4K LASER CINEMA 120"</text>

  <!-- Hardwood Parquet Herringbone Floor -->
  <polygon points="0,560 1200,560 1200,675 0,675" fill="url(#floorWood)"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#332418" stroke-width="2"/>
  
  <!-- Low-Profile Designer Sofa (Italian Lounge) -->
  <rect x="440" y="470" width="620" height="110" rx="10" fill="url(#sofaFabric)" stroke="#4a4a52" stroke-width="1.5"/>
  <rect x="470" y="440" width="560" height="50" rx="8" fill="#2d2d33" stroke="#404048" stroke-width="1"/>
  <!-- Sofa Cushions -->
  <rect x="475" y="490" width="170" height="75" rx="6" fill="#323238" stroke="#45454d" stroke-width="1"/>
  <rect x="665" y="490" width="170" height="75" rx="6" fill="#323238" stroke="#45454d" stroke-width="1"/>
  <rect x="855" y="490" width="170" height="75" rx="6" fill="#323238" stroke="#45454d" stroke-width="1"/>

  <!-- Low Minimalist Walnut Coffee Table -->
  <rect x="580" y="590" width="340" height="40" rx="3" fill="#1f1610" stroke="#3a291e" stroke-width="1"/>
  <!-- Architectural Digest subtle art book -->
  <rect x="620" y="582" width="60" height="10" rx="1" fill="#e4e4e7" opacity="0.9"/>
  <rect x="625" y="580" width="50" height="4" rx="1" fill="#b87333"/>

  <!-- Architectural Indicator Overlay Badge -->
  <g transform="translate(40, 600)">
    <rect width="280" height="46" rx="2" fill="#09090b" opacity="0.85" stroke="#27272a" stroke-width="1"/>
    <circle cx="20" cy="23" r="4" fill="#10b981"/>
    <text x="34" y="20" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">SALON REZYDENCJALNY &amp; KINO</text>
    <text x="34" y="34" fill="#a1a1aa" font-family="monospace" font-size="9">DYSKRETNY EKRAN 120" • GŁOŚNIKI BEZRAMKOWE</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyTwilight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="woodTexture" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="25%" stop-color="#1c1c1f"/>
      <stop offset="50%" stop-color="#17171a"/>
      <stop offset="75%" stop-color="#202024"/>
      <stop offset="100%" stop-color="#151518"/>
    </linearGradient>
    <linearGradient id="concreteWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="domeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="40%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="lensReflect" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Twilight Sky Background -->
  <rect width="800" height="600" fill="url(#skyTwilight)"/>

  <!-- Concrete Monolithic Facade (Left and Bottom) -->
  <rect x="0" y="240" width="460" height="360" fill="url(#concreteWall)"/>
  <!-- Concrete Tie-Rod Architectural Holes -->
  <circle cx="80" cy="300" r="5" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
  <circle cx="80" cy="480" r="5" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
  <circle cx="380" cy="300" r="5" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
  <circle cx="380" cy="480" r="5" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>

  <!-- Glass Curtain Wall with Warm 2700K Interior Glow (Right) -->
  <rect x="460" y="240" width="340" height="360" fill="#18181b"/>
  <rect x="470" y="250" width="330" height="350" fill="#fef3c7" opacity="0.12" filter="url(#softGlow)"/>
  <!-- Interior Curtain Silhouette -->
  <line x1="520" y1="240" x2="520" y2="600" stroke="#09090b" stroke-width="3"/>
  <line x1="660" y1="240" x2="660" y2="600" stroke="#09090b" stroke-width="3"/>

  <!-- Roof Overhang (Charred Yakisugi Cedar Wood Cladding) -->
  <rect x="0" y="0" width="800" height="240" fill="url(#woodTexture)"/>
  <!-- Vertical Wood Planks Lines -->
  <line x1="60" y1="0" x2="60" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="120" y1="0" x2="120" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="180" y1="0" x2="180" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="240" y1="0" x2="240" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="300" y1="0" x2="300" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="360" y1="0" x2="360" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="420" y1="0" x2="420" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="480" y1="0" x2="480" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="540" y1="0" x2="540" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="600" y1="0" x2="600" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="660" y1="0" x2="660" y2="240" stroke="#09090b" stroke-width="2"/>
  <line x1="720" y1="0" x2="720" y2="240" stroke="#09090b" stroke-width="2"/>
  
  <!-- Subtle Terrace Floor LED Wash Line -->
  <line x1="0" y1="240" x2="800" y2="240" stroke="#b87333" stroke-width="2" opacity="0.6"/>

  <!-- Minimalist Hikvision ColorVu Dome Security Camera (Flush Under Overhang) -->
  <g transform="translate(320, 160)">
    <!-- Base Mounting Collar (Anthracite Metal) -->
    <ellipse cx="80" cy="40" rx="70" ry="18" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <ellipse cx="80" cy="45" rx="64" ry="14" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Cast Aluminum Eyeball Body -->
    <path d="M 25,48 C 25,100 135,100 135,48 Z" fill="#202024" stroke="#3f3f46" stroke-width="2"/>
    
    <!-- Dark Optical Glass Dome -->
    <ellipse cx="80" cy="74" rx="42" ry="34" fill="url(#domeGlass)" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- 4K Ultra-Aperture Lens with Anti-Reflective Coating Reflection -->
    <circle cx="80" cy="74" r="22" fill="url(#lensReflect)"/>
    <circle cx="80" cy="74" r="14" fill="#020617" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="76" cy="70" r="3" fill="#ffffff" opacity="0.8"/>
    
    <!-- Micro Smart Hybrid Light LED Ring (Subtle Amber Glow Standby) -->
    <circle cx="62" cy="74" r="3" fill="#f59e0b" opacity="0.4"/>
    <circle cx="98" cy="74" r="3" fill="#f59e0b" opacity="0.4"/>

    <!-- Professional Laser Engraving -->
    <text x="80" y="32" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="7" font-weight="bold" letter-spacing="1">HIKVISION COLORVU 4K</text>
  </g>

  <!-- Architectural HUD Overlay Card -->
  <g transform="translate(30, 520)">
    <rect width="360" height="52" rx="2" fill="#09090b" opacity="0.9" stroke="#27272a" stroke-width="1"/>
    <circle cx="20" cy="26" r="4" fill="#10b981"/>
    <text x="34" y="22" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">INTEGRACJA CCTV W ELEWACJI</text>
    <text x="34" y="38" fill="#a1a1aa" font-family="monospace" font-size="9">PODBITKA DACHOWA • ZERO WIDOCZNYCH KABLI • COLORVU 4K</text>
  </g>
</svg>

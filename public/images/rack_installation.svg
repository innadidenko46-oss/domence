<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a151d"/>
      <stop offset="50%" stop-color="#050b10"/>
      <stop offset="100%" stop-color="#020508"/>
    </linearGradient>
    <linearGradient id="rackMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueCable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ledGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background Utility Room -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Wall Texture Lines -->
  <line x1="0" y1="120" x2="800" y2="120" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Server Rack Frame 19" -->
  <rect x="180" y="50" width="440" height="510" rx="12" fill="url(#rackMetal)" stroke="#334155" stroke-width="3"/>
  <rect x="200" y="70" width="400" height="470" rx="6" fill="#020617" stroke="#1e293b" stroke-width="2"/>

  <!-- Left and Right Mounting Rails with U-Markings -->
  <rect x="205" y="75" width="22" height="460" fill="#1e293b"/>
  <rect x="573" y="75" width="22" height="460" fill="#1e293b"/>
  
  <!-- Patch Panel 24x CAT6A (U1) -->
  <rect x="232" y="85" width="336" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="245" y="105" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">PATCH PANEL 24x CAT.6A STP</text>
  <text x="500" y="105" fill="#38bdf8" font-family="monospace" font-size="9">FLUKE PASSED</text>
  <!-- RJ45 Ports and Blue Cables -->
  <g fill="#0284c7">
    <rect x="245" y="112" width="12" height="10" rx="1"/>
    <rect x="263" y="112" width="12" height="10" rx="1"/>
    <rect x="281" y="112" width="12" height="10" rx="1"/>
    <rect x="299" y="112" width="12" height="10" rx="1"/>
    <rect x="317" y="112" width="12" height="10" rx="1"/>
    <rect x="335" y="112" width="12" height="10" rx="1"/>
    <rect x="353" y="112" width="12" height="10" rx="1"/>
    <rect x="371" y="112" width="12" height="10" rx="1"/>
    <rect x="389" y="112" width="12" height="10" rx="1"/>
    <rect x="407" y="112" width="12" height="10" rx="1"/>
    <rect x="425" y="112" width="12" height="10" rx="1"/>
    <rect x="443" y="112" width="12" height="10" rx="1"/>
    <rect x="461" y="112" width="12" height="10" rx="1"/>
    <rect x="479" y="112" width="12" height="10" rx="1"/>
    <rect x="497" y="112" width="12" height="10" rx="1"/>
    <rect x="515" y="112" width="12" height="10" rx="1"/>
    <rect x="533" y="112" width="12" height="10" rx="1"/>
  </g>

  <!-- Ethernet Cable Loom Combed Downward -->
  <path d="M 251 122 C 251 150, 270 170, 290 175" stroke="#0284c7" stroke-width="3" fill="none"/>
  <path d="M 269 122 C 269 150, 280 170, 292 175" stroke="#0369a1" stroke-width="3" fill="none"/>
  <path d="M 287 122 C 287 145, 290 165, 295 175" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M 305 122 C 305 145, 305 165, 300 175" stroke="#0284c7" stroke-width="3" fill="none"/>
  <path d="M 521 122 C 521 150, 500 170, 480 175" stroke="#0284c7" stroke-width="3" fill="none"/>
  <path d="M 539 122 C 539 150, 510 170, 485 175" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <!-- Switch PoE+ Managed Gigabit (U2) -->
  <rect x="232" y="145" width="336" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="245" y="165" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">HIKVISION POE+ MANAGED SWITCH</text>
  <circle cx="535" cy="166" r="3" fill="#22c55e"/>
  <circle cx="545" cy="166" r="3" fill="#22c55e"/>
  <circle cx="555" cy="166" r="3" fill="#38bdf8"/>

  <!-- DIN Rail 1: Shelly Pro Automation Modules (U3-U4) -->
  <rect x="232" y="200" width="336" height="70" rx="4" fill="#09141f" stroke="#1e293b" stroke-width="1"/>
  <!-- DIN Rail Steel Bar -->
  <rect x="235" y="230" width="330" height="12" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  
  <!-- Module 1: Shelly Pro 4PM -->
  <rect x="245" y="206" width="60" height="58" rx="3" fill="#0f283d" stroke="#0284c7" stroke-width="1.5"/>
  <text x="250" y="222" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="bold">Shelly Pro</text>
  <text x="250" y="233" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">4PM LAN</text>
  <circle cx="253" cy="245" r="2.5" fill="#22c55e"/>
  <circle cx="262" cy="245" r="2.5" fill="#22c55e"/>
  <circle cx="271" cy="245" r="2.5" fill="#22c55e"/>
  <circle cx="280" cy="245" r="2.5" fill="#22c55e"/>
  <rect x="290" y="240" width="10" height="8" rx="1" fill="#0284c7"/>

  <!-- Module 2: Shelly Pro 2PM (Rolety / Żaluzje) -->
  <rect x="312" y="206" width="45" height="58" rx="3" fill="#0f283d" stroke="#0284c7" stroke-width="1.5"/>
  <text x="316" y="222" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="bold">Shelly</text>
  <text x="316" y="233" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold">2PM DIN</text>
  <circle cx="321" cy="245" r="2.5" fill="#22c55e"/>
  <circle cx="330" cy="245" r="2.5" fill="#22c55e"/>

  <!-- Module 3: Shelly Pro Dimmer 2PM (Oświetlenie LED) -->
  <rect x="364" y="206" width="55" height="58" rx="3" fill="#0f283d" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="368" y="222" fill="#f59e0b" font-family="sans-serif" font-size="8" font-weight="bold">Shelly</text>
  <text x="368" y="233" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold">Dimmer</text>
  <circle cx="373" cy="245" r="2.5" fill="#f59e0b"/>
  <circle cx="382" cy="245" r="2.5" fill="#f59e0b"/>

  <!-- Module 4: Wyłączniki Nadprądowe Schneider B16/B10 -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1">
    <rect x="428" y="206" width="16" height="58" rx="2"/>
    <rect x="447" y="206" width="16" height="58" rx="2"/>
    <rect x="466" y="206" width="16" height="58" rx="2"/>
    <rect x="485" y="206" width="16" height="58" rx="2"/>
    <rect x="504" y="206" width="16" height="58" rx="2"/>
  </g>
  <rect x="432" y="225" width="8" height="14" rx="1" fill="#f59e0b"/>
  <rect x="451" y="225" width="8" height="14" rx="1" fill="#f59e0b"/>
  <rect x="470" y="225" width="8" height="14" rx="1" fill="#f59e0b"/>
  <rect x="489" y="225" width="8" height="14" rx="1" fill="#f59e0b"/>
  <rect x="508" y="225" width="8" height="14" rx="1" fill="#f59e0b"/>

  <!-- NVR 4K Surveillance Unit (U5-U6) -->
  <rect x="232" y="285" width="336" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="245" y="308" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">HIKVISION ACUSENSE 4K NVR</text>
  <text x="245" y="325" fill="#64748b" font-family="monospace" font-size="9">DYSKI: 2x 8TB WD PURPLE • ZAPIS CIĄGŁY</text>
  <circle cx="525" cy="308" r="3" fill="#22c55e"/>
  <circle cx="540" cy="308" r="3" fill="#38bdf8"/>
  <circle cx="555" cy="308" r="3" fill="#f59e0b"/>

  <!-- UPS Battery Backup Unit (U7-U8) -->
  <rect x="232" y="365" width="336" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <text x="245" y="395" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="extrabold">UPS ON-LINE 1500VA PURE SINE</text>
  <text x="245" y="415" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">● STATUS: BATTERY 100% • BACKUP TIME: 3h 45m</text>
  <rect x="245" y="425" width="200" height="8" rx="2" fill="#1e293b"/>
  <rect x="245" y="425" width="200" height="8" rx="2" fill="#22c55e"/>

  <!-- Camera Viewfinder Overlay -->
  <rect x="30" y="25" width="740" height="550" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="16 8"/>
  <g fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">
    <text x="45" y="48">● SCHEMAT INSTALACJI RACK 19"</text>
    <text x="560" y="558">STATUS: 100% LOCAL-FIRST</text>
  </g>
</svg>
